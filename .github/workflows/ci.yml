name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host unit tests
        run: make -C test/host test

  compile-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - arduino:avr:uno
          - arduino:samd:mkr1000
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          libraries: |
            - source-path: ./
          # BME_280_BRZO_I2C_Test needs the ESP8266-only brzo_i2c library.
          sketch-paths: |
            - examples/BME280_Modes
            - examples/BME_280_I2C_Test
            - examples/BME_280_Spi_Test
            - examples/BME_280_Spi_Sw_Test
            - examples/Environment_Calculations
